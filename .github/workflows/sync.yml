name: Sync active season to Supabase

# Refreshes the season marked is_active=true in Supabase from the live ESPN API.
# Runs daily so the draft and weekly scores flow in automatically once the
# season starts; preseason runs are quick no-ops (no games yet).
on:
  schedule:
    # Daily at 6:00am Eastern. Cron is UTC-only and has no notion of daylight
    # saving, so both candidate hours are scheduled and the gate job below
    # lets through only the one that is 6am in New York right now.
    - cron: "0 10 * * *" # 6:00am EDT (summer)
    - cron: "0 11 * * *" # 6:00am EST (winter)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  # Picks by which cron fired rather than by the clock, since GitHub can start
  # scheduled runs late.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          FIRED: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then
            want="0 10 * * *"
          else
            want="0 11 * * *"
          fi
          if [ "$FIRED" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update active season
        run: python supabase/update_season.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

      # The site caches every Supabase read for an hour, and each read expires
      # on its own clock — so without this, pages disagree about the score for
      # up to an hour after a sync. One POST drops the whole cache at once.
      - name: Clear the site's read cache
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "SITE_URL / REVALIDATE_SECRET not set - skipping cache clear."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" "${SITE_URL%/}/api/revalidate"
